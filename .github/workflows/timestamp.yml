name: Timestamp picks files

# Triggered when a new picks/*.csv file is pushed, or by hand from the Actions tab.
# Uses OpenTimestamps to anchor each file's SHA-256 hash to the Bitcoin blockchain.
# Commits the .ots proof file back to the repo.
#
# Stamps EVERY picks/*.csv that has no .ots sibling, not only the files in the
# triggering commit. On 2026-10-29 two picks files were pushed 14 seconds apart:
# the first run's proof push was rejected because main had moved, and the second
# run only looked at its own commit, so 08312026.csv was left unstamped. Runs are
# now serialized, the push rebases and retries, and any file missed for any
# reason is picked up by the next run (or a manual one).
#
# A file that already has an .ots is never re-stamped: the proof is of the
# content as first published.

on:
  push:
    paths:
      - 'picks/*.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timestamp-picks
  cancel-in-progress: false

jobs:
  timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenTimestamps client
        run: pip install opentimestamps-client

      - name: Find picks CSVs without a proof
        id: find
        shell: bash
        run: |
          new_files=""
          for f in picks/*.csv; do
            if [ -f "$f" ] && [ ! -f "${f}.ots" ]; then
              new_files="$new_files $f"
            fi
          done
          echo "Files to stamp: $new_files"
          echo "files=$new_files" >> "$GITHUB_OUTPUT"

      - name: Stamp each new file
        if: steps.find.outputs.files != ''
        shell: bash
        run: |
          for f in ${{ steps.find.outputs.files }}; do
            echo "Stamping $f..."
            ots stamp "$f"
          done

      - name: Commit OTS proofs
        if: steps.find.outputs.files != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks/*.csv.ots 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new .ots files to commit."
            exit 0
          fi
          git commit -m "Add OpenTimestamps proofs for newly committed picks"
          # main may have moved since checkout (another picks push); rebase onto it.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main"
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "Could not push proofs after 5 attempts"
          exit 1
